# 建立或更新指向 main 的 Pull Request 時自動檢查：先檢查語法與程式風格，通過後才跑測試。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q app tests
      - name: Ruff
        run: ruff check .

  tests:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mediagent
          POSTGRES_PASSWORD: mediagent
          POSTGRES_DB: mediagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediagent -d mediagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # 測試只使用 MockAdapter 與假的 HTTP 傳輸層，不會連到真實平台，也不需要任何 Secret
      - name: Run pytest
        run: python -m pytest -q
