# 建立或更新指向 main 的 Pull Request 時自動檢查：
# 後端先檢查語法與程式風格，通過後才跑測試；前端做型別檢查、單元測試與建置；最後確認 Docker 映像檔建置得起來。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q app tests
      - name: Ruff
        run: ruff check .

  tests:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mediagent
          POSTGRES_PASSWORD: mediagent
          POSTGRES_DB: mediagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediagent -d mediagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # 測試只使用 MockAdapter 與假的 HTTP 傳輸層，不會連到真實平台，也不需要任何 Secret
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # pnpm 版本取自 package.json 的 packageManager
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: Docker build
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 多階段建置：前端打包進後端映像檔（foundation-plan D-06）；只建置不推送
      - name: Build image
        run: docker build --tag mediagent:ci .

  e2e:
    name: E2E
    # 只在指向 main 的 Pull Request 執行：用 Docker Compose（PLATFORM_MODE=mock）跑 docs/requirements.md 的三個情境，不會連到真實平台
    if: github.event_name == 'pull_request'
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    env:
      COMPOSE: docker compose -p mediagent-e2e -f ../docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7
      # 先在背景建置並啟動服務，同時安裝測試工具與瀏覽器，縮短總時間
      - name: Start stack in background
        run: nohup $COMPOSE up -d --build > /tmp/stack-up.log 2>&1 &
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: e2e/.nvmrc
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for stack
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:18100/health > /dev/null && exit 0
            sleep 5
          done
          cat /tmp/stack-up.log
          exit 1
      - name: Run E2E
        run: pnpm test
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 300 api
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
