[tool.ruff]
# 中文字在 ruff 中算 2 個寬度，含中文註解與訊息的行需要寬一點
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI 的 Depends()／Security() 寫在參數預設值是慣用寫法
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 驗收測試的 PENDING 以規格的 Rule 全名為鍵，直接照抄、不能折行
"tests/bdd/test_*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Starlette 的 TestClient 建議改用 httpx2；本專案固定使用 httpx，升級時再一起處理
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
