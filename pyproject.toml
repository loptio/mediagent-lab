[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI 的 Depends()／Security() 寫在參數預設值是慣用寫法
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Starlette 的 TestClient 建議改用 httpx2；本專案固定使用 httpx，升級時再一起處理
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
